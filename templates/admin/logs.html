<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Log Sistem | Admin - SPK ANP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin/home.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body class="page-admin">

  <div id="mobile-overlay" onclick="toggleSidebar()"></div>

  <div class="admin-wrapper">

    <aside id="sidebar">
      <div class="sidebar-header">
        <h4>SPK Admin</h4>
        <button id="sidebar-close-btn" onclick="toggleSidebar()"><i class="bi bi-x-lg"></i></button>
      </div>
      <ul class="nav flex-column p-3">
        <li class="nav-item mb-2">
          <a href="{{ url_for('admin_home') }}" class="nav-link">
            <i class="bi bi-house-door-fill"></i> Dashboard
          </a>
        </li>
        <li class="nav-item mb-2">
          <a href="{{ url_for('admin_logs') }}" class="nav-link active">
            <i class="bi bi-file-text-fill"></i> Log Sistem
          </a>
        </li>
        <li class="nav-item mb-2">
          <a href="{{ url_for('admin_kriteria') }}" class="nav-link">
            <i class="bi bi-sliders"></i> Kelola Kriteria
          </a>
        </li>
      </ul>
      <div class="p-3 mt-auto border-top border-secondary">
        <a href="{{ url_for('logout') }}" class="btn btn-outline-light w-100">
          <i class="bi bi-box-arrow-right"></i> Logout
        </a>
      </div>
    </aside>

    <main id="page-body">

      <div class="d-lg-none d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
          <h4 class="m-0 fw-bold text-primary">Log Sistem</h4>
          <button class="btn btn-primary" onclick="toggleSidebar()">
              <i class="bi bi-list fs-4"></i>
          </button>
      </div>

      <div class="container-fluid p-0">

        <div class="d-none d-lg-block">
            <h2 class="fw-bold mb-3 text-primary">📄 Log Sistem</h2>
            <p class="text-muted mb-4">Riwayat aktivitas sistem.</p>
        </div>

        <div class="card shadow-sm mb-4 p-3">
          <form method="get" class="row g-3">
            <div class="col-12 col-md-4">
              <label class="form-label">Actor</label>
              <input type="text" name="actor" value="{{ request.args.get('actor','') }}"
                     class="form-control" placeholder="contoh: user:8">
            </div>
            <div class="col-12 col-md-3 d-flex align-items-end gap-2">
              <button class="btn btn-primary flex-fill">
                <i class="bi bi-funnel"></i> Filter
              </button>
              <a href="{{ url_for('admin_logs') }}" class="btn btn-outline-secondary">
                Reset
              </a>
            </div>
          </form>
        </div>

        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white fw-bold">
            Riwayat Log
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-bordered mb-0 text-nowrap" style="min-width: 800px;">
                  <thead class="table-primary">
                    <tr>
                      <th>Waktu</th>
                      <th>Actor</th>
                      <th>Aksi</th>
                      <th>Detail</th>
                    </tr>
                  </thead>
                  <tbody>
                    {% for l in logs %}
                    <tr>
                      <td>{{ l.timestamp }}</td>
                      <td>{{ l.actor }}</td>
                      <td>{{ l.action }}</td>
                      <td>{{ l.detail or '-' }}</td>
                    </tr>
                    {% else %}
                    <tr>
                      <td colspan="4" class="text-center py-4">Tidak ada log.</td>
                    </tr>
                    {% endfor %}
                  </tbody>
                </table>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script>
      function toggleSidebar() {
          document.getElementById('sidebar').classList.toggle('active');
          document.getElementById('mobile-overlay').classList.toggle('active');
      }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
