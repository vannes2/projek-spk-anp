<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daftar Akun - SPK ANP</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="bg-light page-login">

    <div class="container d-flex flex-column justify-content-center align-items-center min-vh-100 py-4">

        <div class="text-center mb-4">
            <h1 class="fw-bold text-primary m-0">
                <i class="fas fa-chart-line me-2"></i>SPK ANP
            </h1>
        </div>

        <div class="card shadow-sm border-0 rounded-4" style="width: 100%; max-width: 400px;">
            <div class="card-body p-4 p-md-5">
                
                <div class="text-center mb-4">
                    <h4 class="fw-bold text-dark">Buat Akun Baru</h4>
                    <p class="text-muted small">Lengkapi data diri untuk mendaftar</p>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm fs-6" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form action="{{ url_for('register') }}" method="POST">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Nama Lengkap</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                            <input type="text" name="name" class="form-control bg-light border-start-0" placeholder="Contoh: Budi Santoso" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Email Address</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                            <input type="email" name="email" class="form-control bg-light border-start-0" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted">Password</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control bg-light border-start-0" placeholder="••••••" required>
                        </div>
                        <div class="form-text small text-muted ms-1">Minimal 6 karakter</div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">
                        Daftar Akun
                    </button>
                </form>

                <div class="text-center mt-4 pt-2">
                    <p class="small text-muted mb-0">Sudah punya akun?</p>
                    <a href="{{ url_for('login') }}" class="text-decoration-none fw-bold text-primary">Login di sini</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
